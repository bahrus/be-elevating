<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'xtal-element/index.js';
        import '/🛗.js';
    </script>
</head>
<body>
    <mood-stone itemscope>
        <div id=div itemprop=songLyricOfTheDay></div>
        <button id=button
            data-msg="Hello darkness my old friend"  
            disabled 🛗="?.dataset?.msg to songLyricOfTheDay on mouseover">
            Select Me
        </button>
        <xtal-element
            prop-defaults='{"songLyricOfTheDay": ""}'
            xform='{
                "| songLyricOfTheDay": 0
            }'
        ></xtal-element>
    </mood-stone>
    <div id=target></div>
    <script>
        function runTest(){
            button.dispatchEvent(new MouseEvent('mouseover'));
            setTimeout(() => {
                if(div.textContent === 'Hello darkness my old friend'){
                    target.setAttribute('mark', 'good');
                }
            }, 500);
            
        }
        setTimeout(() => {
            runTest();
        }, 2000);
    </script>
</body>
</html>
