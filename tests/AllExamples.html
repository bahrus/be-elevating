<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <mood-stone></mood-stone>
    <div id=target></div>
    
    <script type=module>
        import '/MoodStone/MoodStone.js';
        import '/🛗.js';
    </script>

<script>
    function runTest(){
        const mce = document.querySelector('mood-stone');
        var input = mce.shadowRoot.querySelector('input');
        input.checked = true;
        input.dispatchEvent(new Event('input'));
        setTimeout(() => {
            if(mce.shadowRoot.querySelector('#isHappy').textContent === 'true'){
                target.setAttribute('mark', 'good');
            }
        }, 500);
        
    }
    setTimeout(() => {
        runTest();
    }, 2000);
</script>
</body>
</html>
