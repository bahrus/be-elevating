<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type=module>
        import 'xtal-element/index.js';
        import '/🛗.js';

</head>
<body>
    <mood-stone itemscope>
        <div itemprop=likes></div>
        <input type=checkbox disabled 🛗="to isHappy">

            xform='{
                "div": "isHappy"
            }'
        ></xtal-element>
    </mood-stone>
</body>
