<!DOCTYPE html>
<html lang="en">
<head>

    <script type=module>
        import 'xtal-element/index.js';
        import '/🛗.js';

</head>
<body>
    <mood-stone itemscope>
        <div itemprop=songLyricOfTheDay></div>
        <button 
            data-msg="Hello darkness my old friend"

            xform='{
                "| songLyricOfTheDay": 0
            }'
        ></xtal-element>
    </mood-stone>
</body>
